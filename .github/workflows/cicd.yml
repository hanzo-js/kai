# The caller; every knob is in /hanzo.yml. github.com reads workflows from .github/workflows only.
name: CI/CD
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: true
jobs:
  cicd:
    # The reusable asks for these; hanzo-js repos give the token read only, and a called workflow cannot raise it.
    permissions:
      contents: write
      packages: write
    uses: hanzoai/ci/.github/workflows/build.yml@v2
    secrets: inherit
